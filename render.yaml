# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: avatar-guide
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GROQ_API_KEY
        sync: false # entered in the Render dashboard, never committed
